{% extends 'base.html' %}

{% block title %}تفريغ الصوت الاحترافي{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/streaming-effects.css') }}">
{% endblock %}

{% block body %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card p-4 border-0 shadow-sm mb-4">
                <h6 class="fw-bold mb-3">ارفع ملفاً صوتياً (MP3, WAV)</h6>
                <div class="input-group mb-3">
                    <input type="file" class="form-control form-control-sm" id="file" accept="audio/*">
                    <button class="btn btn-primary btn-sm" id="transcribeAudio" onclick="transcribeFunction()">ابدأ التفريغ</button>
                </div>
                <small class="text-muted">ملاحظة: قد يستغرق التفريغ بعض الوقت بناءً على طول المقطع.</small>
            </div>

            <div class="form-group mb-3">
                <label class="fw-bold small mb-2">النص المفرغ (النتيجة):</label>
                <textarea class="form-control" id="toSummarize" rows="8" style="font-size: 14px;"></textarea>
                <button class="btn btn-outline-secondary btn-sm mt-2" onclick="clipboard('toSummarize')">نسخ النص</button>
            </div>

            <div class="form-group mb-4">
                <label class="fw-bold small mb-2">الكلمات المفتاحية المستخرجة:</label>
                <input type="text" class="form-control" id="keywords" readonly style="font-size: 13px;">
            </div>

            <div class="card p-4 border-0 shadow-sm text-center bg-light">
                <h6 class="fw-bold mb-3">توليد صورة تعبيرية للمحتوى</h6>
                <button class="btn btn-success btn-sm mb-3" onclick="generateImage()" id="drawButton">توليد صورة من النص</button>
                <img id="outputImage" class="img-fluid rounded shadow-sm mx-auto" style="display: none; max-width: 400px;">
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/transcribe.js') }}"></script>
{% endblock %}
